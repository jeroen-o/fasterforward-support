name: Releasenotes controleren

# Elke ochtend (en handmatig via Actions -> Run workflow): nieuwe releasenotes ophalen van eBlinqx Hypotheekadvies
# (fastlane.hypotheekbond.nl en het helpcenter, tools/fastlane_sync.py) en van FinConnect en DIAS Assurantie
# (documenten op verzekeringhypotheek.blinqx.tech/releasenotes, tools/rn_overig_sync.py) en de zoekindex van de
# eBlinqx-website (alle pagina's van verzekeringhypotheek.blinqx.tech, tools/vh_sync.py); daarna bouwen en publiceren.
# Is er niets nieuws, dan gebeurt er niets.
on:
  schedule:
    - cron: "17 5 * * *"   # 05:17 UTC = 06:17/07:17 Nederlandse tijd
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: wayback
  cancel-in-progress: false

jobs:
  controleren:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pillow && sudo apt-get install -y -q poppler-utils
      - name: Nieuwe releasenotes ophalen, bouwen en publiceren
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          python3 tools/fastlane_sync.py | tee uitvoer.txt
          python3 tools/rn_overig_sync.py | tee -a uitvoer.txt
          python3 tools/vh_sync.py | tee -a uitvoer.txt
          python3 tools/yt_sync.py | tee -a uitvoer.txt
          python3 tools/intercom_sync.py | tee -a uitvoer.txt
          python3 tools/brochures_sync.py | tee -a uitvoer.txt
          if [ "$(grep -c "Gewijzigd: niets" uitvoer.txt)" = "6" ]; then echo "Geen nieuwe releasenotes."; exit 0; fi
          wat=$(sed -n 's/^Gewijzigd: //p' uitvoer.txt | grep -v '^niets$' | paste -sd ', ')
          rm uitvoer.txt
          for i in 1 2 3 4 5; do
            python3 tools/build.py
            git add -A
            git diff --cached --quiet && exit 0
            git commit -q -m "Releasenotes bijgewerkt: $wat"
            git push -q origin HEAD:main && exit 0
            echo "main is intussen gewijzigd; opnieuw op de nieuwste versie"; sleep 15
            git fetch -q origin main && git reset -q --hard origin/main
            python3 tools/fastlane_sync.py > /dev/null
            python3 tools/rn_overig_sync.py > /dev/null
            python3 tools/vh_sync.py > /dev/null
            python3 tools/yt_sync.py > /dev/null
            python3 tools/intercom_sync.py > /dev/null
            python3 tools/brochures_sync.py > /dev/null
          done
          echo "::error::Pushen mislukt"; exit 1

  bewaken:
    # GitHub zet geplande workflows na 60 dagen zonder activiteit in de repository uit: elke run zet hem weer aan.
    # Mislukt de controle, dan komt er een issue (met e-mailmelding); bij een geslaagde run wordt dat issue gesloten.
    needs: controleren
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Geplande controle actief houden
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/releasenotes.yml/enable" || true
      - name: Melding bij mislukte controle
        if: needs.controleren.result == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          titel="Releasenotes-controle mislukt"
          nr=$(gh issue list -R "${{ github.repository }}" --state open --search "$titel in:title" --json number --jq '.[0].number')
          tekst="De dagelijkse releasenotes-controle is mislukt op $(date -u +%Y-%m-%d). Bekijk de run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$nr" ]; then gh issue comment "$nr" -R "${{ github.repository }}" --body "$tekst"
          else gh issue create -R "${{ github.repository }}" --title "$titel" --body "$tekst"; fi
      - name: Melding sluiten na geslaagde controle
        if: needs.controleren.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for nr in $(gh issue list -R "${{ github.repository }}" --state open --search "Releasenotes-controle mislukt in:title" --json number --jq '.[].number'); do
            gh issue close "$nr" -R "${{ github.repository }}" --comment "De controle werkt weer."
          done
