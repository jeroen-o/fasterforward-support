name: Internet Archive ophalen en site bouwen

# Handmatig starten via Actions -> "Internet Archive ophalen en site bouwen" -> Run workflow.
#
# Taak 1 (ophalen): tools/wayback-ophalen.py haalt de gearchiveerde pagina's, afbeeldingen en pdf's van
#   support.fasterforward.nl op naar bronnen/wayback/. Elke 25 minuten wordt de voortgang gecommit, zodat er
#   nooit werk verloren gaat. Alleen bronnen/wayback/ wordt gecommit: daar komt verder niemand aan, dus er
#   ontstaan geen botsingen met andere wijzigingen.
# Taak 2 (bouwen): bouwt de site op de nieuwste versie van main en commit het resultaat. Mislukt de push omdat
#   main intussen is veranderd, dan wordt opnieuw gebouwd op de nieuwe versie (er wordt nooit samengevoegd).
# Taak 3: is het ophalen nog niet klaar en is er voortgang geboekt, dan start de workflow zichzelf opnieuw.
on:
  workflow_dispatch:
    inputs:
      alleen_kennisbank:
        description: "Alleen kennisbank en homepage ophalen (sneller)"
        type: boolean
        default: false
      ronde:
        description: "Volgnummer (automatisch)"
        default: "1"

permissions:
  contents: write
  actions: write

concurrency:
  group: wayback
  cancel-in-progress: false

jobs:
  ophalen:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    outputs:
      onaf: ${{ steps.loop.outputs.onaf }}
      nieuw: ${{ steps.loop.outputs.nieuw }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ophalen in blokken van 25 minuten, voortgang steeds committen
        id: loop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          ARGS="--uit bronnen/wayback --pauze 0.5 --werkers 4 --max-minuten 25"
          if [ "${{ inputs.alleen_kennisbank }}" = "true" ]; then ARGS="$ARGS --kennisbank"; fi
          start=$(date +%s); nieuw=false; onaf=true; fouten=0
          commit_data() {
            for pad in bronnen/wayback tools/mislukte_afbeeldingen.txt; do
              [ -e "$pad" ] && git add "$pad"
            done
            echo "Te committen: $(git diff --cached --name-only | wc -l) bestanden"
            git diff --cached --quiet && return 0
            git commit -q -m "Internet Archive: $1 (ronde ${{ inputs.ronde }})"
            nieuw=true
            for i in 1 2 3 4 5; do
              git pull -q --rebase origin main && git push -q origin HEAD:main && return 0
              sleep 10
            done
            echo "::error::Pushen van de opgehaalde bestanden is mislukt"; exit 1
          }
          while true; do
            set +e; python3 tools/wayback-ophalen.py $ARGS; code=$?; set -e
            echo "wayback-ophalen.py stopte met code $code"
            if [ "$code" != "0" ] && [ "$code" != "3" ]; then
              fouten=$((fouten + 1))
              if [ $fouten -ge 3 ]; then commit_data "tussenstand"; echo "::error::Ophalen 3x mislukt (code $code)"; exit 1; fi
              sleep 120; continue
            fi
            fouten=0
            if [ "$code" = "0" ]; then
              timeout 40m python3 tools/download_afbeeldingen.py --max-minuten 35 || true
              onaf=false
            fi
            commit_data "pagina's en bestanden"
            [ "$onaf" = "false" ] && break
            [ $(( $(date +%s) - start )) -gt $(( 270 * 60 )) ] && break
          done
          echo "onaf=$onaf" >> "$GITHUB_OUTPUT"
          echo "nieuw=$nieuw" >> "$GITHUB_OUTPUT"

  bouwen:
    needs: ophalen
    if: always() && needs.ophalen.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Site bouwen op de nieuwste main en committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 tools/build.py
            git add -A
            git diff --cached --quiet && { echo "Geen wijzigingen in de site."; exit 0; }
            git commit -q -m "Site opnieuw gebouwd met inhoud uit het Internet Archive"
            git push -q origin HEAD:main && exit 0
            echo "main is intussen gewijzigd; opnieuw bouwen op de nieuwe versie"; sleep 15
          done
          echo "::error::Pushen van de gebouwde site is mislukt"; exit 1

  volgende-ronde:
    needs: [ophalen, bouwen]
    if: needs.ophalen.outputs.onaf == 'true' && needs.ophalen.outputs.nieuw == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Volgende ronde starten
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run afbeeldingen.yml --repo "${{ github.repository }}" --ref main \
            -f alleen_kennisbank=${{ inputs.alleen_kennisbank }} \
            -f ronde=$(( ${{ inputs.ronde }} + 1 ))
